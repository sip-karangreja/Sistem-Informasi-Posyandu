<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Posyandu Harapan Bahagia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HALAMAN LOGIN -->
    <div id="loginSection" class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <h2>Posyandu Harapan Bahagia</h2>
                <p>Desa Karangreja</p>
            </div>
            <form id="loginForm" onsubmit="prosesLogin(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Masukkan username admin/kader" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Masukkan password" required>
                </div>
                <div class="form-row login-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe"> Ingat Saya
                    </label>
                    <a href="#" class="forgot-pwd" onclick="alert('Silakan hubungi Bidan Desa untuk reset password.')">Lupa Password?</a>
                </div>
                <button type="submit" class="btn-submit" id="btnLogin">LOGIN MASUK</button>
            </form>
        </div>
    </div>

    <!-- HALAMAN DASHBOARD & APLIKASI (Disembunyikan di awal) -->
    <div id="dashboardSection" class="hidden">
        <nav class="navbar">
            <div class="brand">Posyandu Harapan Bahagia</div>
            <button class="btn-logout" onclick="prosesLogout()">Logout</button>
        </nav>

        <main class="container">
            <section class="search-box">
                <input type="text" id="searchInput" placeholder="Ketik NIK, Nama Peserta, atau Nama Ibu...">
                <button onclick="cariData()">Cari Data</button>
            </section>

            <div id="loading" class="hidden">Memuat data dari server...</div>
            <section id="contentArea">
                <div class="empty-state">
                    <h3>Selamat Datang!</h3>
                    <p>Silakan cari data peserta menggunakan nama atau NIK di atas.</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal Form Input Hybrid -->
    <div id="modalRekamMedis" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="tutupModal()">&times;</span>
            <h2 id="modalTitle">Input Rekam Medis</h2>
            <br>
            <form id="formRM" onsubmit="tanganiSimpanData(event)">
                <input type="hidden" id="formNik">
                <input type="hidden" id="formKategori">
                
                <div class="form-group hidden" id="groupNamaIbu">
                    <label>Nama Ibu (Wajib Terisi) <span class="req">*</span></label>
                    <input type="text" id="namaIbu">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Berat Badan (Kg)</label>
                        <input type="number" step="0.1" id="bb" required>
                    </div>
                    <div class="form-group">
                        <label>Tinggi Badan (Cm)</label>
                        <input type="number" step="0.1" id="tb" required>
                    </div>
                </div>

                <div id="fieldPTM" class="hidden">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Status Tensi (mmHg)</label>
                            <input type="text" id="tensi" placeholder="120/80">
                        </div>
                        <div class="form-group">
                            <label>Gula Darah (mg/dL)</label>
                            <input type="number" id="gula">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Kolesterol</label>
                            <input type="number" id="kolesterol">
                        </div>
                        <div class="form-group">
                            <label>Asam Urat</label>
                            <input type="number" step="0.1" id="asam_urat">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Catatan Pemeriksaan</label>
                    <textarea id="catatan" rows="3" required></textarea>
                </div>
                
                <button type="submit" class="btn-submit" id="btnSubmitRM">Simpan Rekam Medis</button>
            </form>
        </div>
    </div>

    <!-- Custom Alert Overlay -->
    <div id="customAlert" class="custom-alert hidden">
        <div class="alert-box">
            <h3 id="alertTitle" class="alert-title">Judul</h3>
            <p id="alertMsg" class="alert-message">Pesan alert.</p>
            <div class="alert-actions">
                <button id="alertBtnCancel" class="btn-alert btn-alert-cancel">Batal</button>
                <button id="alertBtnConfirm" class="btn-alert btn-alert-confirm">OK</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
